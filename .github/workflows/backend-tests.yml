# Starts a local Supabase stack, applies the schema + seed, and runs the
# database security / workflow checks (scripts/supabase-rls-test.mjs).
name: Backend tests

on:
  push:
    branches: ['**']
    paths: ['supabase/**', 'scripts/supabase-rls-test.mjs', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['supabase/**', 'scripts/supabase-rls-test.mjs', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase and apply migrations + seed
        run: npx supabase start
      - name: Security and workflow checks
        run: npm run test:db
