# Builds the Android APK (Capacitor shell around the web app).
# - Every push / PR: checks + debug APK uploaded as a workflow artifact.
# - Push to main: the APK is published to the "apk-latest" release, so this
#   link always serves the newest build (works from a phone, no login):
#   https://github.com/<owner>/<repo>/releases/latest/download/IMMO-Agency.apk
# - Tags `v*` (e.g. v0.1.0): the APK is also attached to a versioned Release.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build web app
        # Without these repo variables the APK runs on local demo data.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync web build into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/IMMO-Agency-${VERSION}-debug.apk"
          # Stable name for the direct-download link.
          cp android/app/build/outputs/apk/debug/app-debug.apk out/IMMO-Agency.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IMMO-Agency-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish latest APK (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTED: ${{ vars.VITE_SUPABASE_URL != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$CONNECTED" = "true" ]; then
            MODE="Connectée au serveur de l’agence : comptes résidents réels (code logement fourni par l’agence)."
          else
            MODE="Mode démonstration : données fictives stockées sur l’appareil, aucune donnée transmise à l’agence."
          fi
          # Recreate the rolling release so it always points at this commit.
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest out/IMMO-Agency.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "IMMO Agency ${VERSION} — dernière version (build ${{ github.run_number }})" \
            --notes "APK de test (debug) construit automatiquement depuis \`main\` (${GITHUB_SHA::7}).

          **Installer sur Android :** ouvrez ce lien depuis le téléphone, téléchargez **IMMO-Agency.apk**, puis autorisez l'installation d'applications inconnues si Android le demande.

          ${MODE}"

      - name: Attach APK to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
